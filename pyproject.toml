[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmemory-framework"
version = "1.0.0"
description = "Persistent semantic memory framework for AI agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Jose Manuel Sabarís García", email = "joker@openclaw.ai"}
]
keywords = ["memory", "ai", "agents", "semantic", "vector", "pgvector"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.0",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.20",
]
ollama = [
    "ollama>=0.1",
]

[project.urls]
Homepage = "https://github.com/llllJokerllll/xMemory-framework"
Documentation = "https://github.com/llllJokerllll/xMemory-framework#readme"
Repository = "https://github.com/llllJokerllll/xMemory-framework"
Issues = "https://github.com/llllJokerllll/xMemory-framework/issues"

[tool.setuptools.packages.find]
include = ["xmemory*"]
exclude = ["sql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
